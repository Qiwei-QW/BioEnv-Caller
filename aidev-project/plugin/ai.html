<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>BioEnv Caller · AI 助手</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#ffffff; --line:#d8d8dc; --fg:#22242a; --muted:#6b6f76;
    --hover:rgba(0,0,0,.055);
    --accent:#1f6feb; --user:#e8f0fe; --ai:#f2f3f5; --err:#b3261e; --ok:#1a7f37; --warn:#9a6700;
    --code:#eff0f2;
    --mono:Consolas,"Courier New",monospace;
  }
  body.theme-dark{
    --bg:#1e1e22; --panel:#26262b; --line:#3a3a42; --fg:#e6e6ea; --muted:#9aa0a6;
    --hover:rgba(255,255,255,.10);
    --accent:#4c8dff; --user:#2a3a55; --ai:#2c2c33; --err:#ff8a80; --ok:#7ee787; --warn:#e3b341;
    --code:#17171b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
    font:13px/1.55 "Microsoft YaHei",system-ui,sans-serif;
  }

  /* 网页运行时探测器：脚本一跑就把这条删掉 */
  #boot{
    flex:none;padding:6px 10px;font-size:12px;
    background:#fff8e1;color:#7a5900;border-bottom:1px solid #ffe08a;
  }

  header{
    padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:8px;flex:none;
  }
  header b{font-size:13px}
  #status{font-size:11px;color:var(--muted);margin-left:8px;text-align:right}
  #status.ok{color:var(--ok)} #status.bad{color:var(--err)} #status.warn{color:var(--warn)}

  /* 页内确认条。
     ★ 页面里绝对不要用 window.confirm / alert / prompt：TBtools 的网页面板
     没有给 JxBrowser 注册 DialogHandler，浏览器弹框会让渲染进程停在"等一个
     永远不会有人点的对话框"上；而 Java 每 700ms 要读一次页面（导出对话、
     补推模型列表都靠这条通道），于是 Swing 的事件线程被一起堵死 —— 用户看到的是
     "点了没反应，而且整个面板都收不起来"。 */
  .confirm{flex:none;display:flex;align-items:center;gap:8px;
    padding:6px 10px;font-size:12px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .confirm[hidden]{display:none}
  .confirm span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .confirm button{font-size:11px;padding:3px 10px}
  .confirm .yes{border-color:var(--err);color:var(--err)}

  /* 会话下拉放在表头：它是"切换"而不是"操作"，和状态栏放一起更顺 */
  #sessSel{
    flex:1;min-width:0;max-width:220px;margin-left:6px;
    padding:2px 6px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--fg);font-size:12px;
  }

  #diag{flex:none}
  #log .empty{display:flex;align-items:center;justify-content:center;height:100%;
    padding:0 26px;color:var(--muted);font-size:12px;text-align:center;line-height:1.8}
  #log{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}

  .m{max-width:100%;padding:7px 10px;border-radius:8px;overflow-wrap:anywhere}
  .m.u{background:var(--user);align-self:flex-end;white-space:pre-wrap}
  .m.a{background:var(--ai);align-self:flex-start;border:1px solid var(--line)}
  .m.e{background:transparent;color:var(--err);border:1px dashed var(--err);font-size:12px;white-space:pre-wrap}
  .m.s{background:transparent;color:var(--muted);font-size:12px;padding:2px 10px}

  /* Markdown 渲染出来的东西 */
  .m.a p{margin:0 0 6px}
  .m.a p:last-child{margin-bottom:0}
  .m.a pre{
    margin:6px 0;padding:8px;overflow-x:auto;border-radius:6px;
    background:var(--code);border:1px solid var(--line);
    font-family:var(--mono);font-size:12px;line-height:1.45;white-space:pre;
  }
  .m.a code{font-family:var(--mono);font-size:12px;background:var(--code);
            padding:0 3px;border-radius:3px}
  .m.a pre code{background:none;padding:0}
  .m.a ul{margin:4px 0;padding-left:18px}
  /* Markdown 表格：面板窄，宽表格要在自己的壳里横向滚，别把整个气泡撑破 */
  .m.a .tbl{overflow-x:auto;margin:6px 0}
  .m.a table{border-collapse:collapse;font-size:12px}
  .m.a th,.m.a td{border:1px solid var(--line);padding:3px 8px;text-align:left;
    white-space:nowrap;vertical-align:top}
  .m.a th{background:var(--panel);font-weight:600}

  /* 诊断卡：折叠成一行，不占地方；它不属于对话，清空会话不会被清掉 */
  details.diag{
    border:1px solid var(--line);border-left:3px solid var(--ok);
    background:var(--panel);font-size:12px;
  }
  details.diag.bad{border-left-color:var(--err)}
  details.diag summary{cursor:pointer;padding:4px 10px;color:var(--muted)}
  details.diag table{border-collapse:collapse;margin:2px 0 8px 10px}
  details.diag td{padding:1px 12px 1px 0;vertical-align:top}
  details.diag td:first-child{color:var(--muted);white-space:nowrap}
  details.diag code{font-family:var(--mono);font-size:11px}

  footer{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:8px}

  details.ctx{border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12px;margin-bottom:6px}
  details.ctx summary{cursor:pointer;padding:5px 8px;color:var(--muted)}
  details.ctx pre{margin:0;padding:8px;max-height:180px;overflow:auto;
                  font-family:var(--mono);font-size:11px;white-space:pre-wrap}

  .row{display:flex;gap:6px;align-items:flex-end}
  textarea{
    flex:1;resize:none;height:56px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--fg);font:13px/1.5 "Microsoft YaHei",system-ui,sans-serif;
  }
  button{
    padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);
    color:var(--fg);cursor:pointer;font-size:12px;white-space:nowrap;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  /* 回答下面那行小动作（重试 / 编辑 / 继续 / 复制）：轻到几乎没存在感，
     但需要的时候就在眼前。 */
  .acts{display:flex;gap:6px;margin:2px 0 10px 0}
  .acts button{font-size:11px;padding:2px 9px;border:1px solid var(--line);border-radius:6px;
    background:var(--panel);color:var(--muted);cursor:pointer}
  .acts button:hover{color:var(--ink);border-color:var(--accent)}
  /* 图标按钮：方一点，不抢视线。svg 图标和文字图标（＋ / 🗑）都要能居中 ——
     flex 负责这件事，否则 svg 会按基线对齐，看上去偏高一点。 */
  button.icon{padding:6px 9px;font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  button.icon svg{width:14px;height:14px;display:block}
  button:disabled{opacity:.5;cursor:default}
  /* 键盘 Tab 过去时要能看出焦点在哪 —— 鼠标点不挂这个规则 */
  .pill:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* 模型配置：放在面板里，不再藏在设置窗口后面 */
  .link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer}
  .mcfg{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;font-size:11px}
  .mcfg[hidden]{display:none}
  .mcfg-h{font-weight:600;margin-bottom:6px;color:var(--fg)}
  .mcfg select,.mcfg input{width:100%;box-sizing:border-box;font-size:11px;padding:4px 6px;
    margin:3px 0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
  .mcfg-f{display:flex;align-items:center;gap:8px;margin-top:4px}
  .mcfg-f button{font-size:11px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--panel);color:var(--fg);cursor:pointer}
  .mcfg-note{color:var(--muted)}
/* 模型胶囊：输入框右下，点开在上面弹列表 */
  /* 箭头用 CSS 画 —— 字符箭头在行里偏高，flex 居中才靠谱 */
  /* 箭头用 SVG —— 字符箭头坐在字上沿，旋转的方框也不会真的居中。 */
  .pill-a{width:10px;height:10px;flex:none;transition:transform .15s}
  .pill-a.open{transform:rotate(180deg)}  /* 展开时指向下 */
  .pill{position:absolute;right:50px;bottom:9px;height:26px;padding:0 6px;
    display:flex;align-items:center;gap:4px;
    border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;
    white-space:nowrap;font-family:inherit}
  .pill:hover{color:var(--ink)}
  .pop{position:absolute;right:50px;bottom:40px;min-width:190px;max-height:220px;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:12px;z-index:20}
  .pop[hidden]{display:none}
  .pop-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer}
  .pop-item:hover{background:var(--hover, rgba(128,128,128,.16))}
  .pop-item .dot{width:7px;height:7px;border-radius:50%;background:#9a9a9a;flex:none}
  .pop-item .dot.ok{background:#2ea043}
  .pop-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pop-item.now{background:var(--hover, rgba(128,128,128,.16));font-weight:600}
  .pop-sep{height:1px;background:var(--line);margin:4px 2px}
  .pop-item.mng{color:var(--accent);font-size:11px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--muted)}
/* 发送按钮进输入框：外层相对定位，按钮压右下角；文字给它让出一条。 */
#askWrap{position:relative;flex:1;display:flex;padding-bottom:44px;
    border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  /* 输入框本身不再有框 —— 框在外层容器上，所以看起来是一个整框。
     ★ 背景必须透明：外层 #askWrap 是圆角 + 1px 边框，而 textarea 是一个直角矩形、
     又铺满外层的上方。一旦它自己画底色，就会从圆角**外面**漏出去，把两个上角的
     圆角盖成方角（实测踩过）。透明背景让外层的那一圈圆角原样留着。 */
  #askWrap #ask{border:0;border-radius:0;background:transparent;box-shadow:none;outline:none}
  /* 聚焦时不做任何强调。
   *
   * 以前这里有一条 #askWrap:focus-within{border-color:var(--accent)}，点进来整个框
   * 变蓝。用户明确要求去掉：一是这圈蓝边在离屏渲染下容易画出缺口，二是这个面板
   * 的焦点经常"粘"在输入框上（点旁边的 Swing 组件不会让网页失焦），蓝框就一直亮着，
   * 看着像有东西没弄完。光标本身在闪，已经足够指示当前在哪。 */
#askWrap #ask{flex:1;width:100%;padding-left:10px;padding-right:14px}
#askWrap #go{position:absolute;right:7px;bottom:7px;width:38px;height:28px;
             min-width:0;padding:0;font-size:13px;line-height:1}
/* 会话名占满那一行：它是这一栏里唯一需要宽度看全的东西。 */
#sessSel{flex:1;min-width:0}
/* + 在输入框左下角，发送在右下角。 */
#askWrap{padding:0 0 44px 0}
#askWrap #ask{padding-left:10px;padding-right:14px}
#askWrap #pick{position:absolute;left:7px;bottom:7px;width:28px;height:28px;
               min-width:0;padding:0;font-size:15px;line-height:1;font-weight:600}
#atts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
#atts .att{display:flex;align-items:center;gap:4px;font-size:11px;
           background:var(--panel);border:1px solid var(--line);border-radius:6px;
           padding:2px 8px;max-width:100%}
#atts .att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
#atts .att b{cursor:pointer;font-weight:400;opacity:.6;padding:0 2px}
#atts .att b:hover{opacity:1}
#explain{display:none;width:100%;margin:0 0 6px;font-size:12px;text-align:left}
/* 输入框高一些。原来一行高，+ 和 ▶ 挤在里面，字还没打几个就到边了。 */
#askWrap #ask{min-height:76px;line-height:1.55;resize:none;padding-top:9px;padding-bottom:0}
/* 加号：不要外框，就是一个符号。它是个辅助入口，不该和发送那个主按钮一样重。 */
#askWrap #pick{left:9px;bottom:9px;width:32px;height:32px;padding:0;
               border:none;background:transparent;box-shadow:none;
               font-size:26px;font-weight:300;line-height:1;color:var(--muted)}
#askWrap #pick:hover{color:var(--ink);background:transparent}
/* 发送：蓝色圆形，里面一个白箭头。字号图标在这个尺寸下不好看，用 SVG。 */
#askWrap #go{right:9px;bottom:9px;width:32px;height:32px;padding:0;
             border-radius:50%;display:flex;align-items:center;justify-content:center}
#askWrap #go svg{width:16px;height:16px;display:block}
#askWrap #go .stop{display:none}
#askWrap #go.busy .send{display:none}
#askWrap #go.busy .stop{display:block}
/* 代码块的复制按钮：平时不占地方，悬停才出来。 */
pre{position:relative}
pre .cp{position:absolute;top:4px;right:4px;font-size:11px;padding:1px 8px;
        opacity:0;transition:opacity .12s;cursor:pointer}
pre:hover .cp{opacity:.85}
pre .cp:hover{opacity:1}
</style>
</head>
<body class="theme-classic">

<!--
  网页运行时探测器。

  这条横幅<b>由脚本自己删掉</b> —— 所以：
    看到它  = 网页里的 JavaScript 没有运行（面板不可能工作）
    看不到  = 脚本跑了
  没有显示器、也没法开控制台时，这是唯一一个不用猜的判断。
-->
<div id="boot">正在检查网页运行时……如果这句话一直不消失，说明网页里的 JavaScript 没有运行。</div>

<!-- header 用 flex + 一个会长的空档，把两个会话按钮压到右上角。 -->
<header style="display:flex;align-items:center;gap:8px">
  <!-- 这里原本还有一句「AI 助手」。标签页上写着 BioEnv Caller、左边图标是机器人，
       再说一遍只是占地方。省下的空间给会话名 —— 那里才是需要宽度的地方。 -->
  <select id="sessSel" title="会话"></select>
  <button id="sessNew" class="icon" title="新建会话">＋</button>
  <button id="sessDel" class="icon" title="删除这个会话">🗑</button>
  <!-- 导出：整段对话已经是 Markdown 了，导出去就能直接看/存档/贴进 issue。
       图标用 SVG 而不是字符 —— 字符箭头坐在字上沿，居中要靠猜。 -->
  <button id="sessExp" class="icon" title="导出为 Markdown"><svg viewBox="0 0 16 16"
      aria-hidden="true"><path d="M8 2v7.5M5 6.5 8 9.5l3-3M3 11v1.6A1.4 1.4 0 0 0 4.4 14h7.2A1.4
      1.4 0 0 0 13 12.6V11" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <!-- status 只在出错时才有字。平时空白，"就绪"那两个字没有信息量。 -->
  <span id="status"></span>
</header>

<!-- 确认条：不可撤销的操作（删会话）走这里。不要用 window.confirm —— 见上面 CSS 里那段注释。 -->
<div id="confirm" class="confirm" hidden>
  <span id="confirmText"></span>
  <button id="confirmYes" class="yes" type="button"></button>
  <button id="confirmNo" type="button"></button>
</div>

<input type="file" id="file" multiple style="display:none">

<div id="log"></div>

<footer>
  <!-- 按钮压在输入框里面的右下角：它只管这一格里的字，放在格子里最直接，
       也把那一行的高度让给文字。 -->
  <div id="atts"></div>
  <button id="explain"></button>
  <div class="row">
    <div id="askWrap">
    <textarea id="ask" rows="4"></textarea>
    <!-- 一个按钮，两种状态：不忙是发送（▶），忙了是停止（■）。
         本来就是同一件事的两面，分成两个按钮只会让人犹豫按哪个。 -->
    <button id="pick" class="icon" title="添加文件或图片">+</button>
    <button id="modelPill" class="pill" title="切换模型"></button>
   <div id="modelPop" class="pop" hidden></div>
   <button id="go" class="primary" title="发送"><svg class="ic send" viewBox="0 0 24 24"
      aria-hidden="true"><path d="M12 5v13M6 11l6-6 6 6" fill="none" stroke="currentColor"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><svg
      class="ic stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10"
      height="10" rx="1.6" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="bar">
    <span id="budget"></span>
  </div>
</footer>

<script>
/* ================================================================
 * BioEnv Caller · AI 助手（网页侧）
 *
 * 这个页面跑在 TBtools 注入的网页运行时里，通过 window.tbtools.ai 调用
 * TBtools 的内置模型。
 *
 * ⚠ 这套接口是**实测出来的契约，不是官方文档** —— 用法从第三方插件 minisvg
 *   的实际用法反推得到。升级 TBtools 之后要重新验证这里。
 *
 * 两条实测出来的行为，代码按它们写：
 *   1. onDelta(s) 给的是**增量**（不是累计全文）—— 所以下面是累加；
 *      最终以 promise 的返回值覆盖，避免两边不一致。
 *   2. 桥不存在时 window.tbtools 整个是 undefined —— 必须先探测再用。
 * ================================================================ */

/* 整个脚本包在 IIFE 里。
 *
 * 不这么做的话，顶层的 var / function 会落到 window 上，撞到 Window 的只读属性就
 * 直接抛异常。踩过一次，很贵：
 *
 *   TypeError: Cannot set property history of #<Window> which has only a getter
 *
 * 那是 "var history = []" 撞上 window.history —— 脚本第一步就死，而 window.onerror
 * 还没赋值，所以页面上什么都不显示，看起来和"脚本没执行"一模一样。
 * function stop() 撞 window.stop 同理。
 *
 * 包起来之后，顶层声明都变成函数作用域，这类碰撞不可能再发生。
 * 需要给外面用的东西（window.tbvAi）显式挂上去。
 */
(function () {
"use strict";

/* 脚本跑到这里就说明 JavaScript 在执行 —— 把探测器横幅撤掉。 */
(function () {
  var b = document.getElementById("boot");
  if (b && b.parentNode) { b.parentNode.removeChild(b); }
})();

/* 未捕获的错误也要看得见：没有控制台，只能靠页面自己说。
 *
 * 这里<b>不能</b>走 t()：这段代码在文案表初始化之前就可能被调用，
 * 而在错误处理器里再抛一个错，就什么都看不见了。所以中英各写一份。 */
window.onerror = function (msg, src, line, col) {
  var box = document.getElementById("log");
  if (box) {
    var d = document.createElement("div");
    d.className = "m e";
    d.textContent = "脚本错误 / Script error: " + msg + "  @" + line + ":" + col;
    box.appendChild(d);
  }
  var s = document.getElementById("status");
  if (s) { s.textContent = "脚本错误 / Script error"; s.className = "bad"; }
  return false;
};

/* ---------------- 文案（中英） ---------------- */
var T = {
  zh: {
    title: "AI 助手",
    send: "发送", stop: "停止", ask: "按 Enter 发送，Shift+Enter 换行",
    ctx: "本次将发送的内容", none: "（无）",
    chk: "正在检查…", noBridge: "桥不可用", ready: "就绪",
    newS: "新建", delS: "删除",
    sessNew: "新建会话", sessDel: "删除这个会话",
  copy: "复制", copied: "已复制",

/* ================================================================
 * Markdown 渲染
 *
 * 模型回的是 Markdown。以前直接当纯文本塞进 textContent，于是用户看到的是
 * 一堆光秃秃的 ``` 和 ** —— 那正是"回答有点乱"的来源。
 *
 * 安全上只有一条规矩：**先把要显示的文本整个转义，再往上加标签**。
 * 所以模型无论回什么，都不可能往页面里注入 HTML。
 * ================================================================ */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function md(src) {
  var text = String(src == null ? "" : src);

  // 代码块先抽出来，免得里面的 * 和 # 被后面的规则改坏。
  var blocks = [];
  function stash(m, code) {
    blocks.push(code.replace(/\n$/, ""));
    return "\u0000B" + (blocks.length - 1) + "\u0000";
  }
  text = text.replace(/```[^\n]*\n?([\s\S]*?)```/g, stash);
  text = text.replace(/~~~[^\n]*\n?([\s\S]*?)~~~/g, stash);

  var out = esc(text);

  // 表格：一行行 | a | b |，第二行必须是 |---|---| 这种分隔行。
  //
  // 放在 `<code>` / `**粗体**` 那些行内规则之前：表格结构先钉死，
  // 免得被列表、标题的规则拆坏；单元格里的行内格式后面照样会处理。
  out = out.replace(/(?:^[ \t]*\|.*\|[ \t]*$(?:\n|$))+/gm, function (chunk) {
    var rows = chunk.replace(/[ \t\n]+$/, "").split("\n").filter(function (l) {
      return l.trim();
    });
    if (rows.length < 2) { return chunk; }
    function cells(line) {
      var s = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return s.split("|").map(function (c) { return c.trim(); });
    }
    var sep = cells(rows[1]);
    var isSep = sep.length > 0;
    for (var k = 0; k < sep.length; k++) {
      if (!/^:?-{2,}:?$/.test(sep[k])) { isSep = false; break; }
    }
    // 第二行不是分隔行 -> 这不是表格，原样还回去。
    if (!isSep) { return chunk; }
    var tbl = "<div class='tbl'><table><thead><tr>";
    cells(rows[0]).forEach(function (c) { tbl += "<th>" + c + "</th>"; });
    tbl += "</tr></thead><tbody>";
    for (var r = 2; r < rows.length; r++) {
      tbl += "<tr>";
      cells(rows[r]).forEach(function (c) { tbl += "<td>" + c + "</td>"; });
      tbl += "</tr>";
    }
    return tbl + "</tbody></table></div>";
  });

  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  out = out.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  out = out.replace(/^#{1,6}\s+(.+)$/gm, "<b>$1</b>");
  // 连续的列表项合成一个 <ul>，而不是一行一个项目符号堆着
  out = out.replace(/(?:^[ \t]*[-*+]\s+.+$(?:\n|$))+/gm, function (chunk) {
    var items = chunk.replace(/[ \t\n]+$/, "").split("\n").filter(function (x) {
      return x.trim();
    }).map(function (x) {
      return "<li>" + x.replace(/^[ \t]*[-*+]\s+/, "") + "</li>";
    }).join("");
    return "<ul>" + items + "</ul>";
  });
  out = out.replace(/^[ \t]*(\d+)\.\s+(.+)$/gm, "$1. $2");

  var parts = out.split(/\n{2,}/);
  var html = "";
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].replace(/^\n+|\n+$/g, "");
    if (!p) { continue; }
    if (/^<(ul|pre|div|table)/.test(p)) { html += p; } else { html += "<p>" + p.replace(/\n/g, "<br>") + "</p>"; }
  }

  html = html.replace(/\u0000B(\d+)\u0000/g, function (m, i) {
    return "<pre><code>" + esc(blocks[+i]) + "</code></pre>";
  });
  // 代码块占位符在分段时被当成普通段落包进了 <p>，而 <pre> 不能放在 <p> 里。
  // 判据必须放在"占位符还原之后"才看得见它 —— 放在前面是查不到的，自检就是这么发现的。
  html = html.replace(/<p>(<pre>[\s\S]*?<\/pre>)<\/p>/g, "$1");
  html = html.replace(/<p>(<div class='tbl'>[\s\S]*?<\/div>)<\/p>/g, "$1");
  return html;
}

/* ================================================================
 * 会话
 *
 * 以前只有一条对话，关掉就没了，也不能清空。这里给最小的会话管理：
 * 新建 / 清空 / 删除 + 一个下拉选择，存在 localStorage 里。
 *
 * file:// 页面在 Chromium 里未必给 localStorage（不透明来源会直接抛），
 * 所以每一次读写都包了 try/catch，拿不到就退化成"这次运行内有效"。
 * ================================================================ */
var SKEY = "bioenv.ai.sessions.v1";

function loadStore() {
  try {
    var raw = localStorage.getItem(SKEY);
    sessions = raw ? JSON.parse(raw) : [];
    if (!(sessions instanceof Array)) { sessions = []; }
  } catch (e) {
    sessions = [];
    storeOk = false;
  }
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    if (!s || typeof s !== "object") { continue; }
    if (!(s.turns instanceof Array)) { s.turns = []; }
    if (!s.id) { s.id = String(Date.now()) + "-" + i; }
    if (typeof s.title !== "string") { s.title = ""; }
  }
}

function saveStore() {
  try {
    localStorage.setItem(SKEY, JSON.stringify(sessions));
    storeOk = true;
    return;
  } catch (e) {
    // 配额满了。以前这里只是 storeOk=false —— 之后一切照常，只是什么都不再保存，
    // 而唯一的提示是下拉框的 tooltip（要悬停才看得到）。那等于悄悄丢数据。
    //
    // 现在：从<b>最老的</b>会话开始丢（绝不动当前这条），丢到能写为止，并说出来。
    var dropped = 0;
    for (var i = sessions.length - 1; i >= 0 && sessions.length > 1; i--) {
      if (sessions[i].id === currentId) { continue; }
      sessions.splice(i, 1);
      dropped++;
      try {
        localStorage.setItem(SKEY, JSON.stringify(sessions));
        storeOk = true;
        renderSessions();
        flash(t("storeDrop").replace("%n", dropped));
        return;
      } catch (e2) {
        // 还不够，继续丢。
      }
    }
    storeOk = false;
    setStatus(t("storeFull"), "bad");
  }
}

function renderSessions() {
  var sel = el("sessSel");
  if (!sel) { return; }
  sel.innerHTML = "";
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    var o = document.createElement("option");
    o.value = s.id;
    // 不带 "(3)" 这种条数：会话名本来就该认出是哪一次，条数只是噪音。
    o.textContent = (s.title || t("untitled"));
    sel.appendChild(o);
  }
  if (currentId) { sel.value = currentId; }
  sel.title = storeOk ? "" : t("storeOff");
}

/** 当前选中的工具名；没有就返回空串。 */
function toolName() {
  return (context && context.tool) ? String(context.tool).trim() : "";
}

/**
 * 清掉页脚那几个数。
 *
 * <p>它们是"上一次请求"的，不是"这条会话"的 —— 换会话时必须一起清，
 * 否则切过去看到的是**上一条会话**的用量和累计，越看越糊涂。
 */
function resetUsage() {
  lastPromptTok = 0;
  lastPromptReal = 0;
  lastOutReal = 0;
  lastRate = 0;
  totalOutTok = 0;
  rateMarks.length = 0;
  lastNoteAt = 0;
  updateStats([]);
}

/**
 * 记一个"到目前为止已经输出多少 token"的采样点，算<b>最近 2 秒</b>的速度。
 *
 * <p>以前这里是"累计 token ÷ 累计秒数"。那个数在开头一定是小的，然后一路往上爬
 * 到真实值 —— 看起来就像一个从 0 开始爬的计数器，而不是"现在多快"。
 * 滑动窗口才能反映当下的速度，而且两秒内就稳定下来。
 */
function noteRate(tokens) {
  var now = Date.now();
  // 流式回答一秒能来上百小段，每次都重算+重排只会让界面发卡。
  if (now - lastNoteAt < 300) { return false; }
  lastNoteAt = now;
  rateMarks.push({ t: now, n: tokens });
  while (rateMarks.length > 2 && now - rateMarks[0].t > 2000) {
    rateMarks.shift();
  }
  if (rateMarks.length < 2) { return false; }
  var dt = (now - rateMarks[0].t) / 1000;
  var dn = tokens - rateMarks[0].n;
  if (dt >= 0.2 && dn >= 0) {
    lastRate = dn / dt;
    return true;
  }
  return false;
}

function newSession() {
  closeConfirm();
  // 会话名先挂当前工具名。一个会话基本就是围绕一个工具展开的，
  // 而"新会话"三个字在一列会话里认不出任何东西（用户明确要求换掉）。
  // auto 记着"这个名字是自动起的"，等第一句问题进来时换成问题的描述。
  var tool = toolName();
  var s = { id: String(Date.now()) + "-" + Math.floor(Math.random() * 1000),
            title: tool, auto: !!tool, at: Date.now(), turns: [] };
  sessions.unshift(s);
  currentId = s.id;
  turns = s.turns;
  resetUsage();
  saveStore();
  renderSessions();
  renderLog();
}

function selectSession(id) {
  closeConfirm();
  for (var i = 0; i < sessions.length; i++) {
    if (sessions[i].id === id) {
      currentId = id;
      turns = sessions[i].turns;
      resetUsage();
      renderSessions();
      renderLog();
      return;
    }
  }
}

function findCurrent() {
  for (var i = 0; i < sessions.length; i++) {
    if (sessions[i].id === currentId) { return sessions[i]; }
  }
  return null;
}

/* ---------- 删除会话：页面内确认 ----------
 *
 * ★ 页面里绝对不要用 window.confirm / alert / prompt。
 *
 * TBtools 的网页面板没有给 JxBrowser 注册 DialogHandler，浏览器弹框等的是一个
 * 永远不会有人点的对话框 —— 渲染进程停在这里；而 Java 每 700ms 要读一次页面
 * （采用命令、导出对话都靠这条通道），于是 Swing 的事件线程跟着堵死。
 * 用户看到的是"点了没反应，面板也收不起来，只能重启 TBtools"。
 *
 * 这个坑已经踩过一次：删会话点了没反应，而且整个界面冻住。不要再踩。
 */
var confirmAction = null;

/** 出一行确认。onYes 只在用户真的点「删除」之后才执行。 */
function askConfirm(text, onYes) {
  var box = el("confirm");
  if (!box) { return; }
  el("confirmText").textContent = text;
  el("confirmYes").textContent = t("yes");
  el("confirmNo").textContent = t("no");
  confirmAction = onYes;
  box.hidden = false;
}

function closeConfirm() {
  var box = el("confirm");
  if (box) { box.hidden = true; }
  confirmAction = null;
}

/**
 * 删除当前会话。
 *
 * <p>原来"清空"和"删除"是两个按钮，但用户想要的结果是同一个：<b>眼前清干净</b>。
 * 合成一个之后，只剩一条会话时就地清空（总得留着一条，否则下拉是空的），
 * 还有别的就直接删掉、切到上一条。
 *
 * <p>有内容时先出确认条（见上面那段）—— 空会话没什么可丢的，直接删。
 */
function deleteCurrent() {
  var s = findCurrent();
  if (!s) { return; }
  if (!s.turns.length) {
    doDelete();
    return;
  }
  askConfirm(t("confirmDel"), doDelete);
}

/** 真正删掉当前会话（已经确认过）。 */
function doDelete() {
  var s = findCurrent();
  if (!s) { return; }
  if (sessions.length <= 1) {
    s.turns.length = 0;
    s.title = "";
    turns = s.turns;
    saveStore();
    renderSessions();
    renderLog();
    return;
  }
  for (var i = 0; i < sessions.length; i++) {
    if (sessions[i].id === currentId) { sessions.splice(i, 1); break; }
  }
  saveStore();
  selectSession(sessions[0].id);
}

/**
 * 兜底标题：工具名 + 时间。只在拿不到问题文字时用（比如只发了附件）。
 */
function titleStamp() {
  var d = new Date();
  var hm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  var tool = (context && context.tool) ? context.tool : "";
  return (tool ? tool + " · " : "") + hm;
}

/**
 * 会话名：第一句问题的开头，压成一行、截到 20 字。
 *
 * <p>用过两种别的写法，都不行：
 * <ul>
 *   <li><b>"工具 · 时间"</b> —— 同一个工具开两次，名字长得一样，认不出是哪一次；</li>
 *   <li><b>content 的头几个字</b> —— content 是"整段上下文 + 问题"，于是标题变成
 *       "以下是当前状态：…"。所以要取的是 {@link questionOf} 挑出来的那一句。</li>
 * </ul>
 */
function questionTitle(list) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].role !== "user") { continue; }
    var s = String(questionOf(list[i]) || "");
    s = s.replace(/```[\s\S]*$/, " ");        // 代码块不进标题
    s = s.replace(/[`*_#>]/g, " ");           // markdown 记号不留
    s = s.replace(/\s+/g, " ").trim();
    if (!s) { continue; }
    return s.length > 20 ? s.slice(0, 20) + "…" : s;
  }
  return "";
}

function touchTitle() {
  var s = findCurrent();
  if (s) {
    var q = questionTitle(s.turns);
    // 自动起的名字（工具名 / 空）在第一句问题进来之后换成问题的描述；
    // 用户自己改过的名字不碰。
    if (q && (!s.title || s.auto)) {
      s.title = q;
      s.auto = false;
    } else if (!s.title) {
      s.title = titleStamp();
      s.auto = false;
    }
  }
  saveStore();
  renderSessions();
}

/**
 * 会话还挂着自动名时跟着上下文走。
 *
 * <p>先开会话、后选工具的顺序很常见（面板一直开着）。这时那个会话名应该
 * 从"新会话"变成工具名 —— 不然一列会话里全是"新会话"。
 */
function nameIfUntitled() {
  var s = findCurrent();
  var tool = toolName();
  if (!s || !tool || s.title) { return; }
  s.title = tool;
  s.auto = true;
  saveStore();
  renderSessions();
}

/* ================================================================
 * 导出这个会话
 *
 * 正文在<b>页面里</b>拼：Java 那边只知道工具和命令，不知道会话里有哪些轮 ——
 * 对话只存在这一侧的 localStorage 里。所以这里拼好，Java 只负责问一句存哪、写文件。
 * ================================================================ */
/* send() 把"上下文 + 问题"整段存进历史。导出是给人看的记录，不是重放请求，
   所以要从这段里把问题挑出来。 */
var MARK = "\n\n---\n\n问题：";

function questionOf(m) {
  // 新会话的轮次自带干净的问题；老会话没有，只能从整段里切出来。
  if (m && typeof m.q === "string" && m.q) { return m.q; }
  var c = String((m && m.content) || "");
  var k = c.indexOf(MARK);
  return k >= 0 ? c.slice(k + MARK.length) : c;
}

function p2(n) { return ("0" + n).slice(-2); }

function stamp() {
  var d = new Date();
  return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate())
    + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}

function fileNameStamp() {
  var d = new Date();
  return "" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate())
    + "-" + p2(d.getHours()) + p2(d.getMinutes());
}

function buildMarkdown() {
  var s = findCurrent();
  if (!s || !s.turns.length) { return null; }
  var title = String(s.title || "").trim() || t("untitled");
  var rows = [];
  rows.push("# " + title);
  rows.push("");
  rows.push("> " + t("expAt") + " " + stamp()
            + " \u00b7 " + t("expModel") + " " + modelLabel()
            + " \u00b7 " + Math.ceil(s.turns.length / 2) + " " + t("expRounds"));
  rows.push("");
  for (var i = 0; i < s.turns.length; i++) {
    var x = s.turns[i];
    // 失败过的那一轮不进导出：记录里只有问题和错误，没有回答。
    if (x.failed) { continue; }
    if (x.role !== "user" && x.role !== "assistant") { continue; }
    rows.push(x.role === "user" ? "## " + t("expMe") : "## " + t("expAi"));
    rows.push("");
    rows.push(questionOf(x));
    // 被停下的一轮：导出里也要写明白，别让半截回答看起来是完整的。
    if (x.role === "assistant" && x.truncated) {
      rows.push(""); rows.push("> " + cappedNoteText());
    }
    if (x.role === "assistant" && x.stopped) { rows.push(""); rows.push("> " + t("stoppedNote")); }
    rows.push("");
  }
  return { name: title + " " + fileNameStamp(), text: rows.join("\n") };
}

/**
 * 导出：把名字和正文写成一条 localStorage 载荷，Java 定时来取。
 *
 * <p>载荷是 {@code encodeURIComponent(名字) + "|" + encodeURIComponent(正文)}。
 * 编码之后整条里不可能有引号、反斜杠、换行 —— 而 {@code |} 本身会被编成 %7C，
 * 所以第一个竖线必然是分隔符。这样它穿过 executeJavaScript 的返回值也不会变形。
 *
 * @return 导出的正文（给自检用）；没有可导出的内容时返回空串
 */
function exportNow() {
  var doc = buildMarkdown();
  if (!doc) { flash(t("expEmpty")); return ""; }
  try {
    localStorage.setItem("tbv.export",
      encodeURIComponent(doc.name) + "|" + encodeURIComponent(doc.text));
    flash(t("expHand"));
    return doc.text;
  } catch (e) {
    setStatus(t("expOff"), "bad");
    return "";
  }
}

/* ================================================================
 * 对话区
 * ================================================================ */
/* ---------------- 附件 ----------------
 * 图片走 Tbtools 桥自带的 chatImage（它官方支持），文本文件在网页里读出来拼进问题 --
 * 桥没有读文件的能力。两边都限大小：桥的错误码里有 too_large，说明图片有上限；
 * 文本不限会直接顶爆 32000 字符的预算。
 */
var atts = [];

/**
 * 附件按钮能不能用。
 *
 * <p>JxBrowser 不会自己弹文件框 —— 插件必须注册 OpenFileCallback / OpenFilesCallback
 * （TBtools 不给插件装）。Java 那边装成功了才会把这里置 true；装不上就把 ⊕ 藏掉，
 * 免得又是一个"点了没反应"的按钮。
 */
var attachOn = true;

function renderAtts() {
  var box = el("atts");
  if (!box) { return; }
  box.innerHTML = "";
  for (var i = 0; i < atts.length; i++) {
    (function (n) {
      var d = document.createElement("div");
      d.className = "att";
      var s = document.createElement("span");
      s.textContent = (atts[n].kind === "img" ? "\u{1F5BC} " : "\u{1F4C4} ") + atts[n].name;
      var x = document.createElement("b");
      x.textContent = "\u00d7";
      x.title = t("drop");
      x.onclick = function () { atts.splice(n, 1); renderAtts(); };
      d.appendChild(s); d.appendChild(x);
      box.appendChild(d);
    })(i);
  }
}

/** 人看得懂的大小。 */
function mb(n) { return (Math.round(n / 1048576 * 10) / 10) + " MB"; }

function addFiles(list) {
  for (var i = 0; i < list.length; i++) {
    (function (f) {
      var img = /^image\//.test(f.type);
      // 只有图片设上限。桥的错误码里有 too_large，说明它那边有上限；
      // 4 MB 是保守划的一条线。撞上了把实际大小也说出来，别让人去猜。
      if (img && f.size > 4 * 1024 * 1024) {
        setStatus(t("bigImg") + mb(f.size) + "）", "bad");
        return;
      }
      // 文本文件不按大小挡。它真正的限制是 32000 字符的预算，
      // 而那是发送时才知道的 —— 拦在这里只会把能用的情况也挡掉。
      // 照读，拼进问题时截断，并写明只取了开头。
      var r = new FileReader();
      r.onload = function () {
        atts.push({ kind: img ? "img" : "txt", name: f.name,
                    data: r.result, mime: f.type || "application/octet-stream" });
        renderAtts();
      };
      r.onerror = function () { setStatus(t("bigFile") + f.name, "bad"); };
      if (img) { r.readAsDataURL(f); } else { r.readAsText(f); }
    })(list[i]);
  }
}

function renderLog() {
  el("log").innerHTML = "";
  var ask = "";
  for (var i = 0; i < turns.length; i++) {
    var m = turns[i];
    if (m.role === "user") {
      // ★ 用户那一轮存的是"整段上下文 + 问题"（发给模型的就是它）。
      // 这里必须只显示问题 —— 否则每次重绘（切语言、收起再展开）都会把
      // 整份工具帮助原文糊到对话区上。
      ask = questionOf(m);
      bubble("u", ask);
      // 失败过的那一轮：问题和错误一起画出来，重绘之后也还在。
      if (m.failed) { bubble("e", m.err || ""); }
    } else {
      var bb = bubble("a", "");
      renderAnswer(bb, m);
      // 动作按钮只挂在最新那条回答下面。重绘（切语言、收起再展开）之后
      // 它们不该凭空消失 —— 复制/重试正是这时候最需要。
      if (i === turns.length - 1) { addActions(bb, ask, m.content); }
    }
  }
  if (!turns.length) {
      // 面板那么大，一行字飘在顶上会显得空。居中放。
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = t("empty");
      el("log").appendChild(e);
    }
}

/**
 * 给回复里每个代码块加一个复制按钮。
 *
 * 用 execCommand 而不是 navigator.clipboard：JxBrowser 默认拒绝后者
 * （svguest 的技能文档里记着这一条），而且那个权限是引擎级的，
 * 一个插件不该去改它。
 */
function wireCopy(root) {
  var pres = root.querySelectorAll ? root.querySelectorAll("pre") : [];
  for (var i = 0; i < pres.length; i++) {
    (function (pre) {
      var b = document.createElement("button");
      b.className = "cp";
      b.type = "button";
      b.textContent = t("copy");
      b.onclick = function () {
        var code = pre.querySelector("code");
        var txt = code ? code.textContent : pre.textContent;
        var done = false;
        try {
          var a = document.createElement("textarea");
          a.value = txt;
          a.style.cssText = "position:fixed;left:-9999px";
          document.body.appendChild(a);
          a.select();
          done = document.execCommand("copy");
          document.body.removeChild(a);
        } catch (e) { done = false; }
        if (done) {
          b.textContent = t("copied");
          setTimeout(function () { b.textContent = t("copy"); }, 1200);
        }
      };
      pre.appendChild(b);
    })(pres[i]);
  }
}

function bubble(kind, text) {
  var d = document.createElement("div");
  d.className = "m " + kind;
  d.textContent = text == null ? "" : text;
  el("log").appendChild(d);
  el("log").scrollTop = el("log").scrollHeight;
  return d;
}

/**
 * 把一段已有的文本压到 {@link ANSWER_MAX_CHARS} 以内。返回 {text, truncated}。
 *
 * <p>只在这一处切片：调用方拿到的永远是不超过上限的字符串，历史里也就不会
 * 出现一个几十 MB 的 content。已经在上限内时原样返回（不复制）。
 */
function capAnswer(text) {
  var s = String(text == null ? "" : text);
  if (s.length <= ANSWER_MAX_CHARS) { return { text: s, truncated: false }; }
  return { text: s.slice(0, ANSWER_MAX_CHARS), truncated: true };
}

/** 截断说明那一行的字（上限值跟着 ANSWER_MAX_CHARS 走，自检改了也对得上）。 */
function cappedNoteText() {
  return t("cappedNote").replace("%n", ANSWER_MAX_CHARS);
}

/**
 * 画一条回答：正文 + 截断说明 / 已停止说明。
 *
 * <p>实时路径和整体重绘都走这里 —— 两处画法必须一样，否则"收起再展开"之后，
 * 被停掉或截断过的那条会看起来像一条完整的回答。
 */
function renderAnswer(box, m) {
  box.innerHTML = md(m && m.content);
  wireCopy(box);
  if (m && m.truncated) { answerNote(box, cappedNoteText()); }
  if (m && m.stopped) { answerNote(box, t("stoppedNote")); }
  return box;
}

/** 往回答气泡里加一行灰色说明。 */
function answerNote(box, text) {
  var note = document.createElement("div");
  note.className = "m s";
  note.textContent = text;
  box.appendChild(note);
}

/** 在对话区插一条灰色系统提示；给了 before 就插在它前面。 */
function noteBefore(before, text) {
  var d = document.createElement("div");
  d.className = "m s";
  d.textContent = text;
  var log = el("log");
  if (before && before.parentNode === log && typeof log.insertBefore === "function") {
    log.insertBefore(d, before);
  } else {
    log.appendChild(d);
  }
  return d;
}

function setStatus(text, cls) {
  // 只在出错时显示。cls 为 ok（也就是"就绪"）时留空 —— 那两个字常驻没有信息量，
  // 用户要求去掉；但错误必须还看得见，所以这个元素留着，只是平时不写字。
  var s = el("status");
  var ok = !cls || cls === "ok";
  s.textContent = ok ? "" : text;
  s.className = cls || "";
}

var flashT = 0;

/**
 * 说一句就收回去的提示。
 *
 * <p>setStatus("…","ok") 是不写字的（那是给"就绪"用的）。可"已送到命令框"这种反馈
 * <b>必须看得见</b> —— 用户点了按钮，两三秒后才发现另一边变了，中间那几秒会以为
 * 点空了。所以凡是"某个动作成了"，都走这里。
 */
function flash(text) {
  var s = el("status");
  if (!s) { return; }
  s.textContent = text;
  s.className = "";
  clearTimeout(flashT);
  flashT = setTimeout(function () { s.textContent = ""; }, 2200);
}

/** 发送/停止那一个按钮的样子：不忙是 ▶，忙了是 ■。 */
function goUI() {
  var b = el("go");
  if (!b) { return; }
  // 切 class，不再改 textContent —— 里面是两个 SVG，改文字会把它们冲掉。
  b.className = busy ? "primary busy" : "primary";
  b.title = busy ? t("stop") : t("send");
}

/* ---------------- 启动诊断 ----------------
 * 这一步就是冒烟测试：桥在不在、有哪些方法。折叠成一行，不占地方；
 * 展开才看细节。它不放进对话区，所以清空会话不会把它清掉。
 */
function boot() {
  bridge = (window.tbtools && window.tbtools.ai) ? window.tbtools.ai : null;

  // 只探测桥，不再摆那张诊断卡（用户要求去掉）。
  // 桥不在、或者形状不对，就走 status 那一行报出来 —— 那种时候必须有话说。
  if (bridge) {
    if (typeof bridge.chat !== "function") {
      setStatus(t("chatNotFn"), "bad");
    }
  } else {
    setStatus(t("noBridge"), "bad");
  }
}

/* ---------------- 冒烟测试：让模型回一句 ---------------- */
function ping() {
  var btn = el("ping");
  if (!btn) { return; }
  btn.disabled = true;
  var was = btn.textContent;
  btn.textContent = t("ping") + " …";
  function done() { btn.disabled = false; btn.textContent = was; }
  try {
    var p = bridge.chat(
      [{ role: "user", content: "只回复两个字：通了" }],
      { onDelta: function () {} }
    );
    Promise.resolve(p).then(function (r) {
      bubble("a", t("pingOk") + (typeof r === "string" ? r : "(非字符串返回值)"));
      setStatus(t("ready"), "ok");
    }).catch(function (e) {
      bubble("e", t("pingFail") + describe(e));
    }).then(done);
  } catch (e) {
    bubble("e", t("pingFail") + describe(e));
    done();
  }
}

/** 把 reject 出来的东西变成一句人话。 */
function describe(e) {
  if (!e) { return t("noErrInfo"); }
  var code = (typeof e === "string") ? e : (e.code || e.reason || e.message || "");
  if (code && why(code) !== String(code)) { return why(code); }
  return String(code || e);
}

/* ---------------- Java 推过来的接口 ---------------- */
window.tbvAi = {
  setContext: function (json) {
    try {
      context = (typeof json === "string") ? JSON.parse(json) : json;
    } catch (e) {

    }
    nameIfUntitled();
    refreshCtx();
  },
  setTheme: function (name) {

    if (n === "dark") { document.body.classList.add("theme-dark"); }
  },
  setLang: function (name) {
    lang = (String(name).toLowerCase() === "en") ? "en" : "zh";
    applyLang();
  },
  /**
   * Java 推过来的模型列表。
   *
   * <p>这里只拿来渲染 label 和状态点 —— <b>key 不进 DOM</b>。
   * 请求要用的时候再从对象里取，不渲染、不记录。
   */
  setModels: function (json) {
    try {
      models = (typeof json === "string") ? JSON.parse(json) : (json || []);
    } catch (e) {
      models = [];
    }
    if (!(models instanceof Array)) { models = []; }
    renderPill();
    if (el("modelPop") && !el("modelPop").hasAttribute("hidden")) { renderPop(); }
  },
  /**
   * 附件按钮的开关 —— 由 Java 决定（它才知道文件对话框装没装上）。
   */
  setAttach: function (on) {
    attachOn = !!on;
    var b = el("pick");
    if (b) { b.style.display = attachOn ? "" : "none"; }
  },
  /** 给自检用：拼一段 Markdown 但不保存；以及走完整的导出路径。 */
  markdown: buildMarkdown,
  exportNow: exportNow,
  /** 给自检用：Markdown 渲染函数本身（表格/代码块这些要看输出）。 */
  render: md,
  /** 给自检用：估算函数本身。 */
  estTokens: estTokens,
  /**
   * 给自检用：把空闲超时改短（不传就恢复默认 60 秒）。
   * 生产代码不会调它；只为了让自检在几百毫秒内验到"卡死"那条分支。
   */
  idleTimeout: function (ms) {
    IDLE_TIMEOUT_MS = (typeof ms === "number" && ms > 0) ? ms : 60000;
  },
  /**
   * 给自检用：把单条回答的字符上限改小（不传就恢复默认 1000000）。
   * 生产代码不会调它；只为了让自检不用真的灌 1 MB 文字去验截断。
   */
  answerCap: function (chars) {
    ANSWER_MAX_CHARS = (typeof chars === "number" && chars > 0)
      ? Math.floor(chars) : 1000000;
  }
};

/* ---------------- 上下文 ---------------- */
function ctxText() {
  if (!context) { return ""; }
  var parts = [];
  if (context.tool) { parts.push("[工具] " + context.tool + (context.env ? "  @" + context.env : "")); }
  if (context.mode) {
    parts.push("[连接] " + context.mode + (context.workdir ? "  工作目录：" + context.workdir : ""));
  } else if (context.workdir) {
    parts.push("[工作目录] " + context.workdir);
  }
  if (context.command) { parts.push("[当前命令]\n" + context.command); }
  if (context.options && context.options.length) {
    var lines = [];
    for (var i = 0; i < context.options.length; i++) {
      var o = context.options[i];
      lines.push("  " + o.flag + (o.arg ? " " + o.arg : "")
        + (o.description ? "  — " + o.description : ""));
    }
    parts.push("[参数表]\n" + lines.join("\n"));
  }
  if (context.help) { parts.push("[帮助原文]\n" + context.help); }
  if (context.lastRun) {
    parts.push("[上次运行] 退出码 " + context.lastRun.exit + "\n" + (context.lastRun.tail || ""));
  }
  // extras 自带标题（例如“[这台机器上可用的工具]”），
  // 再套一层“[插件用法]”就串了 —— 它以前确实是插件用法，现在不是了。
  if (context.docs) { parts.push(context.docs); }
  return parts.join("\n\n");
}

function refreshCtx() {
  // 上次运行失败了就露一个入口。数据是 Java 已经在推的 context.lastRun，
  // 不用为它新建任何通道。
  var bad = context && context.lastRun && context.lastRun.exit !== 0;
  var b = el("explain");
  if (b) {
    b.textContent = t("explain");
    b.style.display = bad ? "" : "none";
  }
  var txt = ctxText();
  // 不是把 prompt 铺开（那个面板已经删了），只说“来源” ——
  // 于是用户知道该去表单里补什么信息。
  var bits = [];
  if (context && context.tool) { bits.push(context.tool + " 的帮助"); }
  if (context && context.workdir) { bits.push("工作目录"); }
  if (context && context.lastRun) { bits.push("上次运行"); }
  updateStats(bits);
}

/* ================================================================
 * token 估算
 *
 * 页面里没有分词器，也没有模型的词表 —— 所以只能估。估的时候要满足两条：
 *   1. 尽量贴近真实分词器：中文/日文/韩文/全角标点 1 字 ≈ 1 token，
 *      其它（英文、代码、路径）4 字符 ≈ 1 token；
 *   2. 宁高不低：估多了只是早一点丢历史，估少了会被服务端当场拒。
 *
 * 以前这里是"字符数 ÷ 2"。中文上勉强（真实约 0.6/字），但工具帮助、命令、
 * 报错几乎全是英文，而英文约 4 字符 1 token —— 那部分被高估了整整一倍。
 * 页脚那行数字看着很精确，实际上可能差一倍。
 * ================================================================ */
function estTokens(s) {
  var t = String(s == null ? "" : s);
  var cjk = 0;
  var other = 0;
  for (var i = 0; i < t.length; i++) {
    var c = t.charCodeAt(i);
    if ((c >= 0x3000 && c <= 0x303F) ||      // 中日韩标点
        (c >= 0x3040 && c <= 0x30FF) ||      // 平假名 / 片假名
        (c >= 0x3400 && c <= 0x4DBF) ||      // 扩展 A
        (c >= 0x4E00 && c <= 0x9FFF) ||      // 基本汉字
        (c >= 0xAC00 && c <= 0xD7AF) ||      // 谚文
        (c >= 0xF900 && c <= 0xFAFF) ||      // 兼容汉字
        (c >= 0xFF00 && c <= 0xFFEF)) {      // 全角
      cjk++;
    } else {
      other++;
    }
  }
  return cjk + Math.ceil(other / 4);
}

/** 这一次请求的提示有多少 token：服务端给过真值就用真值。 */
function usedTokens() {
  return lastPromptReal > 0 ? lastPromptReal : lastPromptTok;
}

/**
 * 底部那一行：上下文用量 / 上限 / 百分比 · 轮数。
 *
 * <p>服务端返回了 usage 就是真数；没有时是估算，估算前面带一个 ≈ ——
 * 别让人把一个猜出来的数字当成账单。
 */
function updateStats(bits) {
  var m = currentModel();
  var lim = (m && m.maxIn > 0) ? m.maxIn : 0;
  var out = [];
  var used = usedTokens();
  if (used > 0) {
    var exact = lastPromptReal > 0;
    out.push(t("statCtx") + " " + (exact ? "" : t("statApprox")) + compactN(used)
             + (lim > 0 ? " / " + compactN(lim) + " \u00b7 "
                 + Math.min(999, Math.round(used / lim * 100)) + "%" : " tok"));
  }
  // 轮数按"回答了几次"数，不按消息条数 ÷ 2 —— 失败的那一轮只有一条消息，
  // 条数除以二会算错。
  var rounds = 0;
  for (var ri = 0; ri < turns.length; ri++) {
    if (turns[ri].role === "assistant") { rounds++; }
  }
  if (rounds > 0) { out.push(rounds + " " + t("statRound")); }
  if (lastRate > 0) { out.push(Math.round(lastRate) + " tok/s"); }
  if (totalOutTok > 0) { out.push(t("statTotal") + " " + compactN(totalOutTok) + " tok"); }
  if (bits && bits.length) { out.push(t("statBits") + " " + bits.length + " " + t("statItems")); }
  el("budget").textContent = out.join(" \u00b7 ");
}

function applyLang() {
  document.documentElement.lang = lang === "en" ? "en" : "zh";
  goUI();
  el("sessNew").title = t("sessNew");
  el("sessDel").title = t("sessDel");

    el("pick").title = attachOn ? t("pick") : t("noAttach");
    el("pick").style.display = attachOn ? "" : "none";
  }
  boot();
  renderSessions();
  renderLog();
}

/* ---------------- 发送 ---------------- */
function sysPrompt() {
  return lang === "en"
    ? "You are the assistant built into the TBtools plugin BioEnv Caller. It gives a GUI "
      + "to bioinformatics command-line tools running on Linux (WSL or a remote host over SSH). "
      + "Answer from the context provided; if the context does not contain the answer, say so "
      + "rather than guessing. Never invent parameter names. Put commands in fenced code blocks. "
      + "Keep answers short and practical."
    : "你是 TBtools 插件 BioEnv Caller 内置的助手。这个插件把 Linux（WSL 或 SSH 远程主机）上的"
      + "生信命令行工具变成图形界面。请只依据给你的上下文回答；上下文里没有的，就说不知道，不要编。"
      + "绝对不要编造参数名。给出命令时请放进代码块。回答要简短、可操作。";
}

/**
 * 用用户自己的 OpenAI 兼容接口发一次请求。
 *
 * <p>为什么在页面里发：页面→Java 没有通道，Java →页面只有注入。
 * 通道只有一个方向能用，那就只能在这一边发。
 *
 * <p>流式解析：SSE 的事件之间用空行分隔，而分片不保证落在边界上 ——
 * 所以必须把它当流处理，不能假设每一块就是一个完整事件。
 */
function trimToBudget(msgs, maxIn) {
    // 不发给服务端 —— 只在本地决定发多少上下文。
    // 单位是 token（估算），和页脚那一行用同一个口径：两处口径不一样的话，
    // 用户会看到"明明没到上限，历史却被截了"。
    if (!maxIn || maxIn <= 0 || msgs.length <= 2) { return msgs; }
    var out = msgs.slice();
    var total = 0;
    for (var i = 0; i < out.length; i++) {
      total += estTokens(out[i].content);
    }
    while (total > maxIn && out.length > 2) {
      var dropped = out.splice(1, 1)[0];      // 第 0 条是 system，不动
      total -= estTokens(dropped.content);
    }
    return out;
  }

/**
 * baseUrl → 真正要请求的地址。
 *
 * <p>设置里允许填 "https://host/v1"，也允许把完整地址贴进来（"…/v1/chat/completions"）。
 * 两种都要能用，而且 /chat/completions 只拼一次。没写 http(s):// 的返回 null ——
 * 由调用方立刻报错，而不是让 fetch 把相对地址解析到 file:// 上，再吐一句看不懂的
 * "Failed to fetch"。
 */
function endpointUrl(baseUrl) {
  var u = String(baseUrl == null ? "" : baseUrl).trim();
  u = u.replace(/\/+$/, "");
  u = u.replace(/\/chat\/completions$/i, "");
  u = u.replace(/\/+$/, "");
  if (!/^https?:\/\//i.test(u)) { return null; }
  return u + "/chat/completions";
}

/** 从请求地址里取主机名，只为了把错误说清楚（不解析 URL，畸形地址也不会抛）。 */
function hostOf(url) {
  var m = String(url || "").match(/^https?:\/\/([^\/?#]+)/i);
  return m ? m[1] : String(url || "");
}

/**
 * 桥那一路的消息预算：最多 {@link BRIDGE_MAX_MESSAGES} 条（AiContext.java:19 的实测值）。
 *
 * <p>只裁<b>这一次请求</b>的消息数组，<b>不动 turns</b> —— 面板、localStorage 里的会话
 * 和导出的 Markdown 因此都还是完整的。按整轮丢（一条问句连同它的回答），免得模型
 * 看到半轮对话。返回 {@code {msgs, dropped}}，dropped 是丢掉的轮数。
 */
function fitBridgeMessages(msgs) {
  var out = msgs.slice();
  var dropped = 0;
  // out[0] 是 system，最后一条是这次的问题，两头都不动。
  while (out.length > BRIDGE_MAX_MESSAGES && out.length > 2) {
    if (out.length >= 3 && out[1].role === "user" && out[2].role === "assistant") {
      out.splice(1, 2);
      dropped++;
    } else {
      out.splice(1, 1);
    }
  }
  // 万一前面删得只剩半轮（回答没有配套的问句），也一起去掉。
  if (out.length > 2 && out[1].role === "assistant") { out.splice(1, 1); }
  return { msgs: out, dropped: dropped };
}

  function sendExternal(msgs, box, cfg) {
  var ctrl = new AbortController();
  var acc = "";
  var trimmed = trimToBudget(msgs, cfg.maxIn);

  /* ---------------- 空闲超时 ----------------
   * fetch 自己的网络超时挡不住"网关接了连接然后一个字节都不发"。
   * 所以这里自己计时：请求发出时开始、响应头到达时重置、每来一段数据再重置；
   * 超时就 abort，并且让外面拿到一个明确的错误（不是永远挂着）。
   *
   * 计时器的结果放在 idle 这个 promise 里，和真正的请求 race ——
   * 哪怕某个环境下 abort 没能把 fetch 弄挂，面板也不会永远停在 busy。
   */
  var timedOut = false;
  var idleTimer = 0;
  var failIdle = null;
  var idle = new Promise(function (ok, fail) { failIdle = fail; });

  function timeoutError() {
    var secs = Math.max(1, Math.round(IDLE_TIMEOUT_MS / 1000));
    var err = new Error(t("idleTimeout").replace("%s", secs));
    err.timedOut = true;
    return err;
  }

  function armIdle() {
    if (timedOut) { return; }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (timedOut) { return; }
      timedOut = true;
      try { ctrl.abort(); } catch (e) {}
      failIdle(timeoutError());
    }, Math.max(1, IDLE_TIMEOUT_MS));
  }

  function disarmIdle() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = 0; }
  }

  /* ---------------- 单条回答的字符上限 ----------------
   * 到了上限之后不再往 acc / 气泡里追加，但<b>继续解析流</b>：
   * 服务端该正常收尾，usage 也照旧拿得到。截断只发生在展示与历史这一侧。
   */
  var truncated = false;
  var capShown = false;

  /** 把新的增量并进 acc，超过上限就只留前 ANSWER_MAX_CHARS 个字符。 */
  function appendCapped(s) {
    s = String(s == null ? "" : s);
    if (acc.length >= ANSWER_MAX_CHARS) {
      if (s.length) { truncated = true; }
      return;
    }
    var room = ANSWER_MAX_CHARS - acc.length;
    if (s.length <= room) {
      acc += s;
    } else {
      acc += s.slice(0, room);
      truncated = true;
    }
  }

  /** 气泡跟着 acc 走；第一次截断时把说明一起写进去，之后就不再重绘了。 */
  function paintAnswer() {
    if (truncated) {
      if (!capShown) {
        capShown = true;
        box.textContent = acc + "\n\n" + cappedNoteText();
      }
    } else {
      box.textContent = acc;
    }
    el("log").scrollTop = el("log").scrollHeight;
  }

  /**
   * 服务端回来的真实用量。
   *
   * <p>流式请求要 {@code stream_options.include_usage} 才会带 usage，
   * 它可能在最后一帧（choices 为空），也可能挂在最后那一小段上。
   * 拿到了就用真值显示 —— 这是唯一能"和 Harness 一样准"的办法，
   * 因为页面里没有分词器。
   */
  function takeUsage(u) {
    if (!u) { return; }
    if (typeof u.prompt_tokens === "number" && u.prompt_tokens > 0) {
      lastPromptReal = u.prompt_tokens;
    }
    if (typeof u.completion_tokens === "number" && u.completion_tokens > 0) {
      lastOutReal = u.completion_tokens;
    }
    updateStats([]);
  }

  function onEvent(chunk) {
    var lines = chunk.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/\r$/, "");
      if (line.indexOf("data:") !== 0) { continue; }
      var payload = line.slice(5).trim();
      if (!payload || payload === "[DONE]") { continue; }
      try {
        var j = JSON.parse(payload);
        if (j && j.usage) { takeUsage(j.usage); }
        var ch = j.choices && j.choices[0];
        var d = ch && (ch.delta || ch.message);
        if (d && d.content) {
          appendCapped(d.content);
          // 每 300ms 刷一次速度就够（见 noteRate）；截断之后 acc 不再变，
          // 也就没必要再对越来越长的字符串重算 token。
          if (!truncated && Date.now() - lastNoteAt >= 300
                  && noteRate(estTokens(acc))) { updateStats([]); }
          paintAnswer();
        }
      } catch (e) {
        // 一个坏帧不能把整次回答带歪。
      }
    }
  }

  // 地址先在这里归一化：没写 scheme 的立刻说清楚，别把相对地址丢给 fetch。
  var url = endpointUrl(cfg.baseUrl);
  if (!url) {
    throw new Error(t("urlBad").replace("%u",
      String(cfg.baseUrl == null ? "" : cfg.baseUrl).trim() || t("none")));
  }

  /* 请求体：输出上限填了才发（否则用服务端默认）。
     真实用量要服务端带 usage，这由 stream_options 打开 —— 但它不是所有
     OpenAI 兼容实现都认，所以放在第一次尝试里，被拒就去掉重发。 */
  function body(withUsage) {
    var b = { model: cfg.model, messages: trimmed, stream: true };
    if (cfg.maxOut > 0) { b.max_tokens = cfg.maxOut; }
    if (withUsage) { b.stream_options = { include_usage: true }; }
    return b;
  }

  function post(withUsage) {
    return fetch(url, {
      method: "POST",
      signal: ctrl.signal,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + (cfg.apiKey || "")
      },
      body: JSON.stringify(body(withUsage))
    });
  }

  function httpError(res) {
    return res.text().then(function (raw) {
      var tail = String(raw || "").slice(0, 300);
      // 服务端万一回显了 key，就打码 —— 错误文字会被用户看到、被截图。
      if (cfg.apiKey) { tail = tail.split(cfg.apiKey).join("***"); }
      throw (lang === "en" ? "HTTP " : "接口返回 ") + res.status + "  " + tail;
    });
  }

  /* 读响应：非流式 JSON 和 SSE 两条路都接。 */
  function consume(res) {
    if (!res.body || !res.body.getReader) {
      return res.text().then(function (txt) {
        var whole = txt;
        try {
          var j = JSON.parse(txt);
          if (j && j.usage) { takeUsage(j.usage); }
          var m = j.choices && j.choices[0] && j.choices[0].message;
          whole = (m && m.content) ? m.content : txt;
        } catch (e) { /* 不是 JSON：原样当回答 */ }
        // 非流式也可能一次回来很长：同样只留前 ANSWER_MAX_CHARS 个字符。
        var capped = capAnswer(whole);
        acc = capped.text;
        if (capped.truncated) { truncated = true; }
        box.textContent = acc;
        return acc;
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder("utf-8");
    var buf = "";
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) {
          if (buf.trim().length) { onEvent(buf); }
          return acc;
        }
        // 收到数据就说明连接还活着 —— 重新开始算空闲时间。
        armIdle();
        buf += dec.decode(r.value, { stream: true });
        // SSE 的事件之间是空行，而空行既可能是 "\n\n" 也可能是 "\r\n\r\n"。
        // 以前只找 "\n\n"，CRLF 的服务器就会把整段回答攒到流结束才渲染。
        var m = buf.match(/\r?\n\r?\n/);
        while (m) {
          onEvent(buf.slice(0, m.index));
          buf = buf.slice(m.index + m[0].length);
          m = buf.match(/\r?\n\r?\n/);
        }
        return pump();
      });
    }
    return pump();
  }

  // 第一次带上 stream_options；服务端不认这个参数（400/422/501）就去掉重发。
  // ★ 只有"去掉之后成功了"才记住这家服务器 —— 否则一次别的原因导致的 400
  //   （模型名写错、额度用完）会被当成"它不支持用量"，之后永远拿不到真数，
  //   而且界面上看不出来。这类静默降级在这个项目里已经出现过好几次了。
  var wantUsage = !usageRefused(cfg.baseUrl);
  armIdle();                       // 等响应头这段也算空闲，必须能超时
  var run = post(wantUsage).then(function (res) {
    armIdle();                     // 响应头到了：重新计时
    if (!res.ok && wantUsage
            && (res.status === 400 || res.status === 422 || res.status === 501)) {
      return post(false).then(function (again) {
        if (again.ok) {
          usageRefuse(cfg.baseUrl);
          armIdle();
          return consume(again);
        }
        return httpError(again);
      });
    }
    return res.ok ? consume(res) : httpError(res);
  }).then(function (text) {
    return (typeof text === "string" && text) ? text : acc;
  }, function (e) {
    if (e && e.name === "AbortError") {
      // 用户按了停止，或者空闲超时已经把 ctrl 断了。半截内容交给外面：
      // 停止由 send() 那边按"已停止"处理，超时由下面 race 里的 idle 报错。
      return acc;
    }
    if (e && e.name === "TypeError") {
      // fetch 的网络层失败全在这里：离线、CORS、证书、地址写错。
      // 浏览器只给一句 "Failed to fetch"，换成人话，并点名是哪台主机。
      var netErr = new Error(t("netFail").replace("%h", hostOf(url)));
      netErr.partial = acc;          // 已经流出来的字别丢，停止时还要显示
      throw netErr;
    }
    throw e;
  });

  // run 结束（成功或失败）就把计时器撤掉，别让它一直挂着。
  var settle = function () { disarmIdle(); };
  run.then(settle, settle);

  // 超时和真正结束两条路一起 race：即使某个环境里 abort 没能把 fetch 弄挂，
  // 面板也不会永远停在 busy。
  var out = Promise.race([run, idle]);
  // abortFn 靠这个下手。
  out.abort = function () {
    disarmIdle();
    try { ctrl.abort(); } catch (e) {}
  };
  // send() 收尾时要问一句"这次被截断了吗"，好在气泡和历史里标出来。
  out.truncated = function () { return truncated; };
  return out;
}

loadSel();
  renderPill();
  el("modelPill").onclick = function (ev) {
    ev.stopPropagation();
    openPop();
  };
  document.addEventListener("click", function (ev) {
    var pop = el("modelPop");
    if (!pop || pop.hasAttribute("hidden")) { return; }
    if (pop.contains(ev.target) || ev.target === el("modelPill")) { return; }
    openPop(false);
  });

  function send() {
  if (busy) { stop(); return; }
  // 自定义模式下不需要桥 —— 请求是页面自己发的。
  if (!bridge && !currentModel()) { return; }

  /** 用户按过停止按钮/ Esc：这次的需求要当"被停下"处理，不能当正常回答。 */
  var stoppedByUser = false;

  var q = el("ask").value.trim();
  // 只带附件、不写字也得能发 —— 否则传个文件问它是什么这件事就做不了。
  if (!q && !atts.length) { return; }
  el("ask").value = "";

  var ctx = ctxText();
  var full = ctx ? ("以下是当前状态：\n\n" + ctx + "\n\n---\n\n问题：" + q) : q;

  // ★ 附件必须在消息装进 msgs 之前拼好。
  //
  // 原来这一段写在 msgs.push 的后面 —— 而 full 是字符串，push 拷的是
  // 当时的值，后面的 += 只改了局部变量。于是附件永远到不了模型（用户实测：
  // AI 回说当前对话中没有包含具体的文件路径或文件内容）。
  var img = null;
  var names = [];
  for (var i = 0; i < atts.length; i++) {
    names.push(atts[i].name);
    if (atts[i].kind === "img" && !img) { img = atts[i]; }
    else if (atts[i].kind === "txt") {
      var whole = String(atts[i].data);
      var part = whole.slice(0, 8000);
      // 截断了必须写出来。不说的话，模型会拿半截文件当完整的来回答，
      // 而用户看不出来它只看了一半。
      full += "\n\n[附件 " + atts[i].name + "]\n" + part
            + (whole.length > part.length
               ? "\n" + t("cutNote") + whole.length + t("cutTail") : "");
    }
  }
  atts.length = 0;
  renderAtts();

  // 空对话时把"选一个工具"那句提示清掉，免得它留在记录里。
  if (!turns.length) { el("log").innerHTML = ""; }
  bubble("u", names.length ? (q + "\n\n\u{1F4CE} " + names.join("、")) : q);

  // 发给模型的历史：只带 user/assistant，不带 system（system 单独放最前）。
  //
  // ★ 用户那些轮只发<b>问题</b>。历史里的 content 是"整段上下文 + 问题"
  //   （老会话）或问题（新会话），而上下文只需要在<b>这一次</b>请求里带一遍 ——
  //   不然 12 轮就等于把整份帮助原文和整个工具清单重发 12 遍，token 直接十倍。
  var msgs = [{ role: "system", content: sysPrompt() }];
  for (var i = 0; i < turns.length; i++) {
    var tr = turns[i];
    if (tr.failed) { continue; }      // 失败的那一轮不算对话，不进模型历史
    if (tr.stopped) { continue; }     // 被停掉的那一轮也不重发：回答只有半截
    if (tr.role === "user") {
      msgs.push({ role: "user", content: questionOf(tr) });
    } else if (tr.role === "assistant") {
      msgs.push({ role: "assistant", content: tr.content });
    }
  }
  msgs.push({ role: "user", content: full });

  // 发之前估一次，用来在底部显示上下文用量。服务端要是回了 usage，
  // 下面会把它换成真值 —— 页脚那时会把 ≈ 去掉。
  var promptTok = 0;
  for (var pi = 0; pi < msgs.length; pi++) {
    promptTok += estTokens(msgs[pi].content);
  }
  lastPromptTok = promptTok;
  lastPromptReal = 0;
  lastOutReal = 0;
  streamT0 = Date.now(); lastRate = 0;
  rateMarks.length = 0;
  lastNoteAt = 0;
  updateStats([]);

  var box = bubble("a", "");
  busy = true;
  goUI();
  if (img) { box.textContent = t("imgNoStream"); }

  var base = "";
  /** 内置桥那一路被截断了吗（自定义模型那条在 p.truncated 里）。 */
  var bridgeTruncated = false;
  var bridgeCapShown = false;
  var p;
  try {
    var cur = currentModel();
    if (img && cur) {
      // 自定义模式下不支持图片 —— 先说清楚，不要把图当文字发过去。
      box.className = "m e";
      box.textContent = (lang === "en")
        ? "Images are not supported on a custom model."
        : "自定义模型暂不支持图片。";
      finish();
      return;
    }
    if (img) {
      // 图片走 chatImage。注意它的签名是 (text, dataUrl, mime) --
      // 一条文本，不是消息数组，所以这一次请求不带历史、也没有流式增量。
      p = bridge.chatImage(full, img.data, img.mime);
    } else if (cur) {
      p = sendExternal(msgs, box, cur);
    } else {
    // 桥对请求有实测上限（约 20 条消息 / 32000 字符，见 AiContext.java:19）。
    // 这里只裁这一次请求，turns 一个字都不动 —— 面板、存盘和导出都保持完整。
    var fit = fitBridgeMessages(msgs);
    if (fit.dropped > 0) {
      noteBefore(box, t("trimNotice").replace("%n", fit.dropped));
    }
    p = bridge.chat(fit.msgs, {
      onDelta: function (s) {
        s = s || "";
        // s 到底是“增量”还是“到目前为止的全文” —— 两种都见过。
        //
        // 这里原来是 base += s，并注明“实测 s 是增量”。但实际跑起来
        // 会整段重复、越滚越长 —— 那正是“s 是全文”时 base += s 的样子。
        //
        // 两种都接：若 s 以 base 开头且更长，它就是全文，直接接收；
        // 否则当增量拼上。这样不用去赌桥的行为。
        // ★ 这里必须是 >= ，不能是 >。
        //
        // 实测（从页面里直接调 chat，把每次的 s 记下来）：
        //   len / prevLen / startsWithPrev
        //    21 /      21 / True        ← 同一份全文又发了一遍
        //    32 /      32 / True
        //    47 /      47 / True
        // 一条回复 898 次回调，前 30 条里就有 3 次这种“没长”的。
        //
        // 而 > 会把它们归到 else 里去做 base += s ——
        // 于是每发生一次，已经显示的内容就被重反一遍，越滚越长。
        // 结束时用最终文本重绘，所以看不出来 —— 故障自己把自己藏了。
        var next = base;
        if (s.length >= base.length && s.indexOf(base) === 0) {
          next = s;                       // 全文（可能超过上限）
        } else if (s.length < base.length && base.indexOf(s) === 0) {
          // 又收到一条更短的，是旧状态，忽略。
        } else if (base.length >= ANSWER_MAX_CHARS) {
          // 已经到上限：不再拼接，别为每次回调造一个 1 MB 的字符串。
          bridgeTruncated = true;
        } else {
          next = base + s;
        }
        var capped = capAnswer(next);
        if (capped.truncated) { bridgeTruncated = true; }
        base = capped.text;
        if (bridgeTruncated) {
          // 第一次截断时把说明写进气泡；之后不再重绘（内容也不会再涨）。
          if (!bridgeCapShown) {
            bridgeCapShown = true;
            box.textContent = base + "\n\n" + cappedNoteText();
          }
        } else {
          box.textContent = base;
          if (Date.now() - lastNoteAt >= 300
                  && noteRate(estTokens(base))) { updateStats([]); }
        }
        el("log").scrollTop = el("log").scrollHeight;
      }
    });
    }
  } catch (e) {
    box.className = "m e";
    box.textContent = describe(e);
    finish();
    return;
  }

  abortFn = function () {
    stoppedByUser = true;
    try {
      // 自定义模型走 AbortController；内置走桥的 requestId。
      if (p && typeof p.abort === "function") { p.abort(); }
      else if (p && p.requestId) { bridge.abort(p.requestId); }
    } catch (e) {}
  };

  /**
   * 用户按了停止：把已经出来的字留在气泡里，标成"已停止"。
   *
   * <p>关键点：<b>不能</b>走正常成功那条路 —— 以前这里把 acc 当最终回答，
   * 于是一个字都没来时 push 了一条 content 空的 assistant，之后每次请求都
   * 把它当历史再发一遍；半截回答也被当成完整的存下来、导出去。
   * 现在被停掉的一轮标记 stopped，不再进模型历史，但面板和导出里都留着。
   */
  function stoppedTurn(text, truncated) {
    if (text) {
      box.className = "m a";
      renderAnswer(box, { content: text, stopped: true, truncated: truncated });
      addActions(box, q, text);
      turns.push({ role: "user", content: q, q: q, stopped: true });
      var asst = { role: "assistant", content: text, stopped: true };
      if (truncated) { asst.truncated = true; }
      turns.push(asst);
    } else {
      // 一个字都没来：连一条空的 assistant 都不要 push。
      // 这一轮同时算"停下的"和"失败的"：stopped 说明为什么没有回答，
      // failed 让它在重绘时走"问题 + 错误提示"那条画法，并且不进模型历史。
      box.className = "m e";
      box.textContent = t("stoppedNote");
      addActions(box, q, null);
      turns.push({ role: "user", content: q, q: q, stopped: true, failed: true,
                   err: t("stoppedNote") });
    }
    touchTitle();
  }

  /** 这一轮到底有没有被截断：内置桥记在 bridgeTruncated，自定义模型在 p.truncated 里。 */
  function wasTruncated() {
    if (bridgeTruncated) { return true; }
    return !!(p && typeof p.truncated === "function" && p.truncated());
  }

  Promise.resolve(p).then(function (r) {
    var text = (typeof r === "string" && r) ? r : base;
    if (stoppedByUser) { stoppedTurn(text, wasTruncated()); return; }
    // 最后兜一次上限：非流式 / 图片那一路可能一次回来很长（流式那边追加时就截过了）。
    var capped = capAnswer(text);
    text = capped.text;
    var truncated = capped.truncated || wasTruncated();
    renderAnswer(box, { content: text, truncated: truncated });
    // 结束时用<b>整段平均</b>收尾：窗口里最后一小段常常偏低，收尾的数字会难看。
    var secs = (Date.now() - streamT0) / 1000;
    if (secs >= 0.3) { lastRate = estTokens(text) / secs; }
    totalOutTok += (lastOutReal > 0 ? lastOutReal : estTokens(text));
    // 回答下面给一行小动作：重试 / 编辑 / 继续 / 复制。
    addActions(box, q, text);
    // 历史里只存<b>问题</b>：上下文在发送时单独带一次（见上面 msgs 那段），
    // 存进历史只会让它跟着每一条记录一起重发。
    turns.push({ role: "user", content: q, q: q });
    var asst = { role: "assistant", content: text };
    if (truncated) { asst.truncated = true; }
    turns.push(asst);
    // 历史在这里<b>不再</b>裁：面板、存盘和导出都应该保留完整对话。
    // 请求装不下时只裁"发出去的那一份"（内置走 fitBridgeMessages，自定义走 trimToBudget）。
    touchTitle();
  }).catch(function (e) {
    // 如果这一轮是被用户停下的：把还看得见的半截文字留下（内置桥在 base 里，
    // 自定义模型在 acc 里；自定义这条路出错时把 acc 挂在 e.partial 上带过来）。
    if (stoppedByUser) {
      stoppedTurn(base || (e && e.partial) || "", wasTruncated());
      return;
    }
    // 失败的那一轮要留在<b>对话里</b> —— 以前什么都不存，于是一收起面板，
    // 这个问题和错误提示就一起消失了。但标成 failed：它不会被当成上下文
    // 再发给模型（见 msgs 那段），"失败的问题"对模型没有意义。
    var code = (typeof e === "string") ? e : (e && (e.code || e.reason));
    var why = describe(e);
    box.className = "m e";
    box.textContent = why;
    turns.push({ role: "user", content: q, q: q, failed: true, err: why });
    if (code === "denied") { addRetry(q); } else { addActions(box, q, null); }
  }).then(finish);

  function finish() {
    busy = false;
    abortFn = null;
    goUI();
    el("log").scrollTop = el("log").scrollHeight;
    refreshCtx();
  }
}

function stop() {
  if (abortFn) { abortFn(); }
}

/** denied 之后给一个"脱敏后重试" —— 去掉绝对路径和明显的文件名。 */
/**
 * 回答下面那一行小按钮。
 *
 * <p>重试和编辑是最常用的两个：限流、超时、断网都会让一次回答作废，
 * 而问错了只能重打一遍也很烦。
 */
function addActions(box, question, text) {
  var row = document.createElement("div");
  row.className = "acts";
  function act(label, fn) {
    var b = document.createElement("button");
    b.textContent = label;
    b.onclick = fn;
    row.appendChild(b);
  }
  if (question) {
    act(lang === "en" ? "Retry" : "\u91cd\u8bd5", function () {
      el("ask").value = question;
      send();
    });
    act(lang === "en" ? "Edit" : "\u7f16\u8f91", function () {
      el("ask").value = question;
      el("ask").focus();
    });
    if (text) {
      act(lang === "en" ? "Continue" : "\u7ee7\u7eed", function () {
        el("ask").value = lang === "en" ? "Continue." : "\u7ee7\u7eed\u3002";
        send();
      });
    }
  }
  if (text) {
    act(lang === "en" ? "Copy" : "\u590d\u5236", function () { copyText(text); });
  }
  box.parentNode.insertBefore(row, box.nextSibling);
  el("log").scrollTop = el("log").scrollHeight;
}

/**
 * 靠 execCommand 复制 —— JxBrowser 拒绝 navigator.clipboard。
 *
 * <p>原来这里还有一个「采用」按钮，把回答里的命令直接塞进命令预览框。去掉了：
 * 一次回答里可能给好几条命令（该用哪条它也不说），而插件这边命令框还牵涉
 * 路径转换和参数重置 —— 塞进去往往是个半对的状态，比让用户复制走更糟。
 * 每个代码块右上角本来就有复制按钮，那才是该走的路。
 */
function copyText(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

function addRetry(original) {
  var d = document.createElement("div");
  d.className = "m";
  d.style.background = "transparent";
  var b = document.createElement("button");
  b.textContent = lang === "en" ? "Retry without paths" : "脱敏后重试";
  b.onclick = function () {
    var safe = original.replace(/(\/[\w.\-]+){2,}/g, "<路径>")
                        .replace(/[A-Za-z]:\\[^\s"']+/g, "<路径>");
    // 上下文也脱敏：只留工具名和参数，不带帮助原文和工作目录。
    var keep = context;
    context = keep ? {
      tool: keep.tool, env: keep.env, mode: keep.mode,
      options: (keep.options || []).map(function (o) {
        return { flag: o.flag, arg: o.arg, description: o.description };
      })
    } : null;
    refreshCtx();
    el("ask").value = safe;
    d.remove();
    send();
  };
  d.appendChild(b);
  el("log").appendChild(d);
  el("log").scrollTop = el("log").scrollHeight;
}

// 一个按钮：忙的时候 send() 自己会转去 stop()（见它第一行）。
el("go").onclick = send;
el("pick").onclick = function () { if (attachOn) { el("file").click(); } };
el("file").onchange = function () { addFiles(el("file").files); el("file").value = ""; };
el("explain").onclick = function () {
  if (busy) { return; }
  el("ask").value = t("explainQ");
  send();
};
/**
 * 退格删字之后，输入框那一块偶尔没被重绘干净，留下几道竖线
 * （删除前那些中文的竖笔画，不是输入框里的内容）。
 *
 * <p>画面是两段组成的：网页 → Chromium 的离屏位图 → Swing 组件把位图贴上来。
 * 哪一段脏了都会留下残影，所以两边都要推：
 *   <ul>
 *     <li>这里：用 {@code display} 开关强制整块重新布局+重新栅格化。
 *         上次只改 {@code transform}，那通常只是复用缓存好的图层，白推。</li>
 *     <li>Java 侧：看到 {@code tbv.repaint} 就把浏览器组件整个重画一遍
 *         （见 AiAssistPanel 的轮询）。</li>
 *   </ul>
 *
 * <p>另外顺手清掉落单的代理字符（半个 emoji 之类，本身也会画成小方块/竖条）。
 */
function stripLoneSurrogates(s) {
  var out = "";
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c >= 0xD800 && c <= 0xDBFF) {
      var n = s.charCodeAt(i + 1);
      if (n >= 0xDC00 && n <= 0xDFFF) {
        out += s.charAt(i) + s.charAt(i + 1);
        i++;
      }
      continue;                       // 落单的高位代理：丢掉
    }
    if (c >= 0xDC00 && c <= 0xDFFF) { continue; }   // 落单的低位代理：丢掉
    out += s.charAt(i);
  }
  return out;
}

/**
 * 删字的时候临时把光标藏起来。
 *
 * <p>★ 这是"一串竖线"的真正原因（用户自己看出来的）：
 *
 * <p>删得快的时候，光标每退一格都会在**旧位置**画一次；离屏渲染这条路上，
 * 旧位置来不及被擦掉，于是留下**一串竖线** —— 那是删到过的每一个光标位置，
 * 不是字符，也不是字影。所以治它的办法不是"重绘"（重绘只是把旧画面再贴一次），
 * 而是**让它在删的时候别画光标**：不画，就没有旧位置可残留。
 *
 * <p>停手 400ms 之后再把光标放回来 —— 那会儿早就不在删了，看不见它消失。
 */
var caretTimer = 0;

function hideCaret() {
  var box = el("ask");
  if (!box || !box.style) { return; }
  box.style.caretColor = "transparent";
  clearTimeout(caretTimer);
  caretTimer = setTimeout(showCaret, 400);
}

function showCaret() {
  var box = el("ask");
  if (box && box.style) { box.style.caretColor = ""; }
}

var deletedByKey = false;
var composing = false;

/**
 * 把输入框这个元素整个重建一个。
 *
 * <p>删空之后那一块有时候会留下残影 —— 可能是像素没被清掉，也可能是输入法留了
 * 几个看不见的字符。重建元素两种情况都能清干净：旧元素连同它的绘制缓存一起扔掉，
 * 新元素从头画一次；而且新元素有实底（见 CSS），会先把那块区域涂一遍。
 */
function rebuildAsk() {
  var old = el("ask");
  if (!old || typeof old.cloneNode !== "function") { return; }   // 自检桩里没有
  var parent = old.parentNode;
  if (!parent || typeof parent.replaceChild !== "function") { return; }
  var fresh = old.cloneNode(false);      // 只复制标签和属性，不带内容
  fresh.id = "ask";
  fresh.value = "";
  parent.replaceChild(fresh, old);
  wireAsk(fresh);
  if (typeof fresh.focus === "function") { fresh.focus(); }
  hideCaret();
}

/** 输入框上的那几个监听。重建元素之后要重新挂一遍。 */
function wireAsk(box) {
  box.addEventListener("keydown", function (e) {
    if (e.key === "Backspace" || e.key === "Delete") {
      deletedByKey = true;
      hideCaret();
    }
  });
  // 中文输入法组字期间绝对不能去动 value / 元素本身 —— 那会把组字状态弄坏。
  box.addEventListener("compositionstart", function () { composing = true; });
  box.addEventListener("compositionend", function () { composing = false; });
  box.addEventListener("input", function () {
    if (composing) { deletedByKey = false; return; }
    var v = box.value;
    var clean = stripLoneSurrogates(v);
    if (clean !== v) { v = clean; box.value = clean; }
    if (!deletedByKey) { return; }
    deletedByKey = false;
    // 删空之后重建元素：这是唯一能同时清掉"残留像素"和"看不见的残留字符"的办法。
    if (v.length === 0) {
      rebuildAsk();
      return;
    }
    // 删了一部分：请 Java 把浏览器组件重画一遍（只重画，不动几何 —— 之前用
    // applySize 重摆，把画面和组件的尺寸关系搞错位，结果输入框边框都残缺了）。
    try { localStorage.setItem("tbv.repaint", "1"); } catch (e) {}
  });
  box.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); if (busy) { stop(); } return; }
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      // ★ 回答中按 Enter <b>不该</b>把回答掐掉。
      //
      // send() 的第一行是"忙就停"（那个 ▶/■ 按钮靠它切换），于是以前边看回答
      // 边打下一个问题、一回车，当前回答就没了。停只有两个入口：Esc 和 ■。
      if (busy) { flash(t("busyHint")); return; }
      send();
    }
  });
}

wireAsk(el("ask"));


el("sessNew").onclick = newSession;
el("sessDel").onclick = deleteCurrent;
el("sessExp").onclick = exportNow;
el("sessSel").onchange = function () { selectSession(el("sessSel").value); };
// 确认条的两个按钮。先关条再执行 —— 回调里可能会切会话/重绘。
el("confirmYes").onclick = function () {
  var fn = confirmAction;
  closeConfirm();
  if (fn) { fn(); }
};
el("confirmNo").onclick = closeConfirm;

/* ---------------- 启动 ---------------- */
loadStore();
if (sessions.length) {
  currentId = sessions[0].id;
  turns = sessions[0].turns;
} else {
  newSession();
}
applyLang();

})();
</script>
